<!DOCTYPE html>
<html>
<head>
  <title>Chatbot</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="font-sans m-0">

  <!-- React app will render here -->
  <div class="js-container"></div>

  <!-- React -->
  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

  <!-- Chatbot library -->
  <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/supersimpledev/babel.js"></script>

  <script type="text/babel">

    // input section
    function ChatInput({ chatMessages, setChatMessages }) {

      // store what user types
      const [inputText, setInputText] = React.useState('');

      // update the input value
      function saveInputText(event) {
        setInputText(event.target.value);
      }

      // runs when send btn is click
      function sendMessage() {

        // don't send empty msg
        if (inputText.trim() === '') {
          return;
        }

        // add the user's msg
        const newChatMessages = [
          ...chatMessages,
          {
            message: inputText,
            sender: 'user',
            id: crypto.randomUUID()
          }
        ];

        setChatMessages(newChatMessages);

        let response;

        const message = inputText.toLowerCase().trim();

        // custom response
        if (
          message === 'is there a class tomorrow?' ||
          message === 'is there a class tomorrow' ||
          message.includes('class tomorrow')
        ) {

          response = 'No. I already suspended it.';

        }

        // this will get today's actual date based on the browser's timezone
        else if (
          message === 'what is today?' ||
          message === 'what is todays date?' ||
          message === "what is today's date?" ||
          message === 'date today' ||
          message.includes('today') && message.includes('date')
        ) {

          const today = new Date();

          response =
            `Today is ${today.toLocaleDateString('en-US', {
              weekday: 'long',
              year: 'numeric',
              month: 'long',
              day: 'numeric'
            })}.`;

        }

        // the default chatbot response
        else {
          response = Chatbot.getResponse(inputText);
        }

        // add chatbot reply
        setChatMessages([
          ...newChatMessages,
          {
            message: response,
            sender: 'robot',
            id: crypto.randomUUID()
          }
        ]);

        // clear textbox
        setInputText('');
      }

      return (
        <div className="flex mb-16">

          <input
            className="flex-grow border border-gray-300 rounded-lg px-4 py-3 text-[15px] outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Send a message to Chatbot"
            value={inputText}
            onChange={saveInputText}
            onKeyDown={(event) => {
              if (event.key === 'Enter') {
                sendMessage();
              }
            }}
          />

          <button
            onClick={sendMessage}
            className="ml-3 bg-sky-600 hover:bg-sky-700 text-white px-5 py-3 rounded-lg transition"
          >
            Send
          </button>

        </div>
      );
    }

    // single chat bubble
    function ChatMessage({ message, sender }) {

      return (

        <div
          className={
            sender === 'user'
              ? 'flex justify-end items-start'
              : 'flex items-start'
          }
        >

          {/* robot img */}
          {sender === 'robot' && (
            <img
              src="chatbot.png"
              className="w-[45px]"
            />
          )}

          {/* chat bubble */}
          <div
            className="bg-gray-200 px-5 py-4 rounded-lg mx-2 mb-5 max-w-[300px]"
          >
            {message}
          </div>

          {/* userprof img */}
          {sender === 'user' && (
            <img
              src="user.png"
              className="w-[45px]"
            />
          )}

        </div>

      );
    }

    // this shows all messages
    function ChatMessages({ chatMessages }) {

      const chatMessagesRef = React.useRef(null);

      // automatically scroll to the newest message
      React.useEffect(() => {

        const container = chatMessagesRef.current;

        if (container) {
          container.scrollTop = container.scrollHeight;
        }

      }, [chatMessages]);

      return (

        <div
          ref={chatMessagesRef}
          className="flex-grow mt-5 overflow-y-scroll [scrollbar-width:none]"
        >

          {chatMessages.map((chatMessage) => (

            <ChatMessage
              key={chatMessage.id}
              message={chatMessage.message}
              sender={chatMessage.sender}
            />

          ))}

        </div>

      );
    }

    // this is main component
    function App() {

      // starting messages
      const [chatMessages, setChatMessages] = React.useState([]);

      return (

        <div className="max-w-[600px] mx-auto h-screen flex flex-col">

          <ChatMessages
            chatMessages={chatMessages}
          />

          <ChatInput
            chatMessages={chatMessages}
            setChatMessages={setChatMessages}
          />

        </div>

      );
    }

    // render react app
    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(<App />);

  </script>

</body>
</html>
